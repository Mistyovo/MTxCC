name: mtx

services:
  mtx:
    image: ${MTX_IMAGE:-ghcr.io/mistyovo/mtx:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.mtx
    ports:
      - "${MTX_PORT:-8080}:8080"
    environment:
      MTX_LISTEN_ADDR: ":8080"
      MTX_DATABASE_URL: postgres://mtx:${MTX_PG_PASSWORD:?请在 .env 设置 MTX_PG_PASSWORD}@postgres:5432/mtx?sslmode=disable
      MTX_MASTER_KEY: ${MTX_MASTER_KEY:?请在 .env 设置 MTX_MASTER_KEY（32 字节 base64）}
      MTX_DATA_DIR: /data
    volumes:
      - mtx-data:/data
      - /var/run/docker.sock:/var/run/docker.sock # 任务沙箱容器编排（只传给 mtx，不进沙箱）
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mtx
      POSTGRES_PASSWORD: ${MTX_PG_PASSWORD:?}
      POSTGRES_DB: mtx
    volumes:
      - mtx-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtx"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # demo profile：DVWA 靶机（docker compose --profile demo up）
  dvwa:
    image: vulnerables/web-dvwa
    profiles: ["demo"]
    ports:
      - "127.0.0.1:4280:80"

volumes:
  mtx-data:
  mtx-pg:
